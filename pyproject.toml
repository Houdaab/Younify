[tool.poetry]
name = "eeg-legitimacy"
version = "1.0.0"
description = "EEG signal analysis and human legitimacy scoring system"
authors = ["EEG Legitimacy Team"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yourusername/eeg-legitimacy"
keywords = ["eeg", "brain", "neuroscience", "classification", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
pandas = "^2.0.0"
scipy = "^1.10.0"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
python-multipart = "^0.0.6"
streamlit = "^1.28.0"
plotly = "^5.18.0"
mne = "^1.5.0"
scikit-learn = "^1.3.0"
openneuro-py = "^2025.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
human-check = "app.human_check:main"
batch-score = "app.batch_score:main"
classify-states = "app.classify_states:main"
download-openeuro = "app.download_openeuro:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

